on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      release: false
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        release: false
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        release: ${{ event.git.branch == 'main' }}

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/soundstep/rwx-app-playground.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: 24.19.0

  - key: pnpm-install
    use: [code, node]
    run: |
      corepack enable
      pnpm install --frozen-lockfile
    filter:
      - package.json
      - pnpm-lock.yaml

  - key: test-guides
    use: [code, node]
    run: node --test tests/guides.test.mjs
    filter:
      - tests/helpers.mjs
      - tests/guides.test.mjs
      - astro.config.mjs
      - src/content/docs/guides

  - key: test-reference
    use: [code, node]
    run: node --test tests/reference.test.mjs
    filter:
      - tests/helpers.mjs
      - tests/reference.test.mjs
      - src/content/docs/reference

  - key: build
    use: pnpm-install
    run: pnpm build

  # Artifact is only published for runs on main; override locally with --init release=true
  - key: package
    use: build
    if: ${{ init.release }}
    run: test -d dist
    outputs:
      artifacts:
        - key: site
          path: dist
