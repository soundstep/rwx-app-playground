<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#0f172a"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#f8fafc">One file changed. Only the tasks that depend on it run.</text>
  <text x="32" y="70" font-size="14" fill="#94a3b8">Measured run: appended a line to src/content/docs/reference/example.md, then rwx run .rwx/ci.yml</text>

  <!-- changed file -->
  <rect x="32" y="110" width="190" height="64" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="127" y="136" font-size="13" fill="#fed7aa" text-anchor="middle">you edit</text>
  <text x="127" y="158" font-size="13" font-weight="600" fill="#fff7ed" text-anchor="middle">reference/example.md</text>

  <!-- code + node -->
  <rect x="32" y="250" width="110" height="46" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="87" y="278" font-size="14" fill="#e2e8f0" text-anchor="middle">code</text>
  <rect x="32" y="312" width="110" height="46" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="87" y="340" font-size="14" fill="#e2e8f0" text-anchor="middle">node</text>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M142,273 C220,273 250,132 330,132"/>
    <path d="M142,273 C230,273 250,244 330,244"/>
    <path d="M142,273 C220,273 250,356 330,356"/>
    <path d="M142,335 C230,335 250,244 330,244" stroke-dasharray="4 4"/>
    <path d="M590,132 L650,132"/>
  </g>
  <path d="M222,142 C290,142 290,356 330,356" stroke="#fb923c" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <!-- pnpm-install (hit) -->
  <rect x="330" y="96" width="260" height="72" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="124" font-size="16" font-weight="700" fill="#f0fdf4">pnpm-install</text>
  <text x="570" y="124" font-size="13" font-weight="700" fill="#4ade80" text-anchor="end">CACHE HIT</text>
  <text x="350" y="148" font-size="12" fill="#86efac">filter: package.json, pnpm-lock.yaml</text>

  <!-- test-guides (hit) -->
  <rect x="330" y="208" width="260" height="72" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="236" font-size="16" font-weight="700" fill="#f0fdf4">test-guides</text>
  <text x="570" y="236" font-size="13" font-weight="700" fill="#4ade80" text-anchor="end">CACHE HIT</text>
  <text x="350" y="260" font-size="12" fill="#86efac">filter: guides/, astro.config.mjs, tests</text>

  <!-- test-reference (executed) -->
  <rect x="330" y="320" width="260" height="72" rx="10" fill="#431407" stroke="#fb923c" stroke-width="2"/>
  <text x="350" y="348" font-size="16" font-weight="700" fill="#fff7ed">test-reference</text>
  <text x="570" y="348" font-size="13" font-weight="700" fill="#fb923c" text-anchor="end">EXECUTED</text>
  <text x="350" y="372" font-size="12" fill="#fdba74">filter: reference/, tests</text>

  <!-- build (executed) -->
  <rect x="650" y="96" width="278" height="72" rx="10" fill="#431407" stroke="#fb923c" stroke-width="2"/>
  <text x="670" y="124" font-size="16" font-weight="700" fill="#fff7ed">build</text>
  <text x="908" y="124" font-size="13" font-weight="700" fill="#fb923c" text-anchor="end">EXECUTED</text>
  <text x="670" y="148" font-size="12" fill="#fdba74">no filter: sees the whole repo</text>

  <!-- takeaway -->
  <rect x="650" y="208" width="278" height="184" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="670" y="238" font-size="14" font-weight="700" fill="#f8fafc">What this means</text>
  <text x="670" y="264" font-size="13" fill="#cbd5e1">Nobody wrote change detection.</text>
  <text x="670" y="286" font-size="13" fill="#cbd5e1">A task re-runs only when the files</text>
  <text x="670" y="306" font-size="13" fill="#cbd5e1">in its filter, its script or its</text>
  <text x="670" y="326" font-size="13" fill="#cbd5e1">dependencies change.</text>
  <text x="670" y="356" font-size="13" fill="#94a3b8">Cache hits still appear in the run</text>
  <text x="670" y="376" font-size="13" fill="#94a3b8">and the status check stays green.</text>
</svg>
